name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  # A manual run builds the 5 assets without publishing a release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: ubuntu-latest, target: linux-x64, asset: t3-dashboard-linux-x64 }
          - { runner: ubuntu-latest, target: linux-arm64, asset: t3-dashboard-linux-arm64 }
          - { runner: ubuntu-latest, target: windows-x64, asset: t3-dashboard-windows-x64.exe }
          # macOS runners build native binaries and sign them ad hoc.
          - { runner: macos-latest, target: darwin-arm64, asset: t3-dashboard-darwin-arm64 }
          - { runner: macos-latest, target: darwin-x64, asset: t3-dashboard-darwin-x64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Build
        shell: bash
        run: |
          version=dev
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" = main ]; then
            version="main-$GITHUB_SHA"
          fi
          bun run scripts/build.ts --target "bun-${{ matrix.target }}" --version "$version" --outfile "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum t3-dashboard-* > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          flags=()
          if [ "$GITHUB_REF_TYPE" = branch ]; then
            tag="main-$GITHUB_SHA"
            flags=(--prerelease --latest=false --title "Main ${GITHUB_SHA:0:7}")
          else
            case "$tag" in *-*) flags=(--prerelease) ;; esac
          fi
          gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes "${flags[@]}"
