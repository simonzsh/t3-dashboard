name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    # The binary ships for macOS and Windows too, so test it there.
    # Unit tests use POSIX paths and sh fakes, so Windows runs only the typecheck and the smoke.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - if: runner.os != 'Windows'
        run: bun run check
      - if: runner.os == 'Windows'
        run: bun run typecheck
      - run: bun run smoke
