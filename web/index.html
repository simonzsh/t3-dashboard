<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Mirrors src/theme.ts: sets data-theme before the first paint to avoid a flash.
      (function () {
        var s = "system";
        try { s = localStorage.getItem("t3-dashboard-theme") || "system"; } catch (e) {}
        var dark = s === "dark" || (s !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-dark-32.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cstyle%3E.bg %7B fill: %23ffffff; %7D %40media (prefers-color-scheme: dark) %7B .bg %7B fill: %23000000; %7D %7D%3C/style%3E%3Crect class='bg' width='512' height='512'/%3E%3Cg transform='translate(256 256) scale(1.25) translate(-256 -256)'%3E%3Crect x='112' y='112' width='128' height='128' rx='30' fill='%235865f2'/%3E%3Crect x='272' y='112' width='128' height='128' rx='30' fill='%235865f2' opacity='0.35'/%3E%3Crect x='112' y='272' width='128' height='128' rx='30' fill='%235865f2' opacity='0.35'/%3E%3Crect x='272' y='272' width='128' height='128' rx='30' fill='%235865f2' opacity='0.65'/%3E%3C/g%3E%3C/svg%3E" />
    <title>T3 Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
