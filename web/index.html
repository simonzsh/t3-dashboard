<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Mirrors src/theme.ts: sets data-theme before the first paint to avoid a flash.
      (function () {
        var s = "system";
        try { s = localStorage.getItem("t3-dashboard-theme") || "system"; } catch (e) {}
        var dark = s === "dark" || (s !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>

</html>
